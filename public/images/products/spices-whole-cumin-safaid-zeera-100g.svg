<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Soft Accent Ambient Glow -->
  <circle cx="300" cy="220" r="160" fill="#a16207" opacity="0.12" />

  <!-- Outer Elegant Frame -->
  <rect x="18" y="18" width="564" height="364" rx="24" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Store Header Strip -->
  <rect x="36" y="28" width="528" height="34" rx="10" fill="#0f291e" opacity="0.9"/>
  <text x="50" y="50" fill="#a3e635" font-size="11" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1">HAFIZ G CHAI &amp; KIRYANA STORE</text>
  <text x="548" y="50" text-anchor="end" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">SPICES & SEASONINGS</text>

  <!-- Product Illustration -->
  <g filter="url(#cardShadow)">
    
        <!-- Spice Pouch with Vibrant Powder -->
        <rect x="240" y="130" width="120" height="185" rx="16" fill="#ffffff" stroke="#78350f" stroke-width="6"/>
        <!-- Top Banner -->
        <rect x="243" y="133" width="114" height="42" rx="12" fill="#78350f"/>
        <text x="300" y="160" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="900" font-family="sans-serif">NATIONAL</text>
        <!-- Center Spice Window -->
        <circle cx="300" cy="225" r="38" fill="#a16207" stroke="#fef08a" stroke-width="3"/>
        <path d="M 275 235 Q 300 200 325 235 Z" fill="#ffffff" opacity="0.3"/>
        <text x="300" y="290" text-anchor="middle" fill="#78350f" font-size="12" font-weight="900" font-family="sans-serif">PURE SPICE</text>
      
  </g>

  <!-- Left Side Badge: Guarantee -->
  <g transform="translate(36, 120)">
    <rect width="130" height="48" rx="12" fill="#ffffff" stroke="#78350f" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="65" y="22" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold" font-family="system-ui, sans-serif">QUALITY SEAL</text>
    <text x="65" y="38" text-anchor="middle" fill="#78350f" font-size="11" font-weight="900" font-family="system-ui, sans-serif">100% KHÁLIS</text>
  </g>

  <!-- Right Side Badge: Unit Weight -->
  <g transform="translate(434, 120)">
    <rect width="130" height="48" rx="12" fill="#ffffff" stroke="#78350f" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="65" y="22" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold" font-family="system-ui, sans-serif">NET WEIGHT</text>
    <text x="65" y="38" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="900" font-family="system-ui, sans-serif">100 G PACK</text>
  </g>

  <!-- Bottom Details Overlay Banner -->
  <g transform="translate(36, 326)">
    <rect width="528" height="48" rx="14" fill="#0f291e" filter="url(#cardShadow)"/>
    <!-- English Name -->
    <text x="24" y="30" fill="#ffffff" font-size="16" font-weight="900" font-family="system-ui, sans-serif">White Cumin / Zeera</text>
    <!-- Badge -->
    <rect x="260" y="14" width="130" height="22" rx="6" fill="#a3e635"/>
    <text x="325" y="29" text-anchor="middle" fill="#052e16" font-size="10" font-weight="900" font-family="system-ui, sans-serif">High Aromatic Tarka</text>
    <!-- Urdu Name -->
    <text x="508" y="31" text-anchor="end" fill="#fef08a" font-size="16" font-weight="bold" font-family="system-ui, 'Noto Nastaliq Urdu', sans-serif">خالص ثابت سفید زیرہ</text>
  </g>
</svg>